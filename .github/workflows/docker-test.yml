name: Todo App CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push and Deploy

    runs-on: [self-hosted, linux, x64]

    env:
      AWS_REGION: ap-south-1              # ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

      IMAGE_TAG: ${{ github.sha }}

    steps:

      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 4. Build and Push Frontend
      # --------------------------------------------------
      - name: Build and push frontend
        run: |

          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPO }}:$IMAGE_TAG \
            ./frontend

          docker push \
            $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPO }}:$IMAGE_TAG


      # --------------------------------------------------
      # 5. Build and Push Backend
      # --------------------------------------------------
      - name: Build and push backend
        run: |

          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPO }}:$IMAGE_TAG \
            ./backend

          docker push \
            $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPO }}:$IMAGE_TAG

      
      - name: Create deployment .env
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}  
        run: |
          {
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
          } > .env

      # --------------------------------------------------
      # 6. Create SSH key on Runner
      # --------------------------------------------------
      - name: Setup SSH key
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

      # --------------------------------------------------
      # 7. Test SSH connection to Application EC2
      # --------------------------------------------------
      - name: Test EC2 SSH connection
        run: |

          ssh -i ~/.ssh/deploy_key \
            ${{ vars.EC2_USER }}@15.206.166.237 \
            "echo SSH connection successful && hostname"


      # --------------------------------------------------
      # 8. Create application directory
      # --------------------------------------------------
      - name: Create application directory
        run: |

          ssh -i ~/.ssh/deploy_key \
            ${{ vars.EC2_USER }}@15.206.166.237 \
            "mkdir -p ${{ vars.EC2_APP_DIR }}"


      # --------------------------------------------------
      # 10. Copy Docker Compose and .env to EC2
      # --------------------------------------------------
      - name: Copy deployment files
        run: |

          scp -i ~/.ssh/deploy_key \
           docker-compose2.yml \
           .env \
           ${{ vars.EC2_USER }}@15.206.166.237:${{ vars.EC2_APP_DIR }}/

      # --------------------------------------------------
      # 11. Deploy application
      # --------------------------------------------------
      - name: Deploy application
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key \
            ${{ vars.EC2_USER }}@15.206.166.237 << EOF

            set -e

            cd "${{ vars.EC2_APP_DIR }}"

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region "ap-south-1" \
              | sudo docker login \
                --username AWS \
                --password-stdin "${{ env.ECR_REGISTRY }}"


            echo "Pulling latest images..."

            sudo docker compose pull


            echo "Starting application..."

            sudo docker compose up -d


            echo "Running containers..."

            sudo docker compose ps

          EOF

