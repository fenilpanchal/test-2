

name: Todo App CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: [self-hosted, linux, x64]

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push frontend image
      - name: Build and push frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPO }}:$IMAGE_TAG \
            ./frontend

          docker push \
            $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPO }}:$IMAGE_TAG

      # 5. Build and push backend image
      - name: Build and push backend
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPO }}:$IMAGE_TAG \
            ./backend

          docker push \
            $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPO }}:$IMAGE_TAG





       # 8. Copy Compose file and environment to App EC2
      - name: Copy deployment files
        run: |
          ssh -i ${{ secrets.EC2_SSH_KEY }} \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} \
            "mkdir -p ${{ vars.EC2_APP_DIR }}"

          scp -i ${{ secrets.EC2_SSH_KEY }} \
            docker-compose.yml .env \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:${{ vars.EC2_APP_DIR }}/

      # 9. Pull images and deploy on App EC2
      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << 'EOF'
              set -e
              cd "${{ vars.EC2_APP_DIR }}"

              aws ecr get-login-password \
                --region "${{ vars.AWS_REGION }}" \
                | docker login \
                  --username AWS \
                  --password-stdin "${{ env.ECR_REGISTRY }}"

              sudo docker compose pull
              sudo docker compose up -d

              sudo docker compose ps
          EOF
