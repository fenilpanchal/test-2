
name: Self Hosted Runner Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify EC2 Runner
        run: |
          echo "Self-hosted runner is working!"
          whoami
          hostname
          docker --version

